<div class="landing-container">
  <div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="content">
    <div class="badge">
      <mat-icon>speed</mat-icon>
      <span>Live Race Data</span>
    </div>

    <h1 class="title">F1 <span class="gradient-text">Dashboard</span></h1>
    <p class="subtitle">
      Alle Rennergebnisse, Fahrerstatistiken und Live-Timings an einem Ort.
    </p>

    <button
      mat-raised-button
      color="primary"
      class="cta-button"
      (click)="openDashboard()">
      <mat-icon>rocket_launch</mat-icon>
      Open F1 Dashboard
    </button>
  </div>
</div>
